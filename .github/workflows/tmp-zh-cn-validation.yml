name: Temporary zh-CN validation

on:
  push:
    branches:
      - zh-cn-l10n

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify canonical localization outputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/gen-l10n.py
          git diff --check
          git diff --exit-code -- \
            extensions/tiktok/src/main/l10n/en.csv \
            extensions/tiktok/src/main/java/app/morphe/extension/tiktok/settings/L10nTranslations.java

      - name: Work around regional filename case on Linux test runner
        shell: bash
        run: |
          cp extensions/tiktok/src/main/l10n/pt-rBR.tsv extensions/tiktok/src/main/l10n/pt-rbr.tsv
          cp extensions/tiktok/src/main/l10n/zh-rCN.tsv extensions/tiktok/src/main/l10n/zh-rcn.tsv

      - name: Run Hushfeed pre-push Gradle gates
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --dependency-verification=off \
            :extensions:tiktok:test \
            :patches:test \
            :extensions:shared:library:lint \
            :extensions:tiktok:lint

      - name: Build Morphe patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=off :patches:buildAndroid

      - name: Upload test bundle
        uses: actions/upload-artifact@v4
        with:
          name: hushfeed-zh-cn-test-bundle
          path: |
            patches/build/release/*.mpp
            patches/build/release/bundle.sha256
          if-no-files-found: error
          retention-days: 7
