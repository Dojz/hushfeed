name: Temporary zh-CN validation

on:
  push:
    branches:
      - zh-cn-l10n

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Hushfeed pre-push Gradle gates
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon             :extensions:tiktok:test             :patches:test             :extensions:shared:library:lint             :extensions:tiktok:lint
