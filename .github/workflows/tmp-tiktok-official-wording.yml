name: Temporary TikTok 47.0.3 official wording audit

on:
  push:
    branches:
      - zh-cn-l10n

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download official-signed TikTok 47.0.3 global APK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, re, sys
          from urllib.parse import urljoin, unquote
          import requests

          page = "https://apkcombo.com/tiktok-videos-shop-live/com.zhiliaoapp.musically/download/apk"
          sess = requests.Session()
          sess.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          })
          r = sess.get(page, timeout=30)
          print("download page:", r.status_code, r.url)
          r.raise_for_status()
          hrefs = [html.unescape(x) for x in re.findall(r'href=["\']([^"\']+)["\']', r.text)]
          candidates = []
          for href in hrefs:
              decoded = unquote(href)
              if "/r2?u=" not in href:
                  continue
              if "com.zhiliaoapp.musically" not in decoded:
                  continue
              if "/47.0.3/" not in decoded or "2024700030" not in decoded:
                  continue
              if ".apk" not in decoded.lower() or ".xapk" in decoded.lower():
                  continue
              candidates.append(href)
          if not candidates:
              print("r2 links seen:", [unquote(x)[:240] for x in hrefs if "/r2?u=" in x][:10])
              raise SystemExit("No 47.0.3 base APK link found")
          download = urljoin(page, candidates[0])
          print("using APKCombo redirect:", download[:260])
          with sess.get(download, headers={"Referer": page}, stream=True, timeout=180, allow_redirects=True) as d:
              print("artifact response:", d.status_code, d.url[:260], d.headers.get("content-type"), d.headers.get("content-length"))
              d.raise_for_status()
              with open("tiktok.apk", "wb") as out:
                  total = 0
                  for chunk in d.iter_content(1024 * 1024):
                      if chunk:
                          out.write(chunk)
                          total += len(chunk)
              print("downloaded bytes:", total)
              if total < 400_000_000:
                  raise SystemExit("Downloaded file is unexpectedly small")
          PY
          sha256sum tiktok.apk
          ls -lh tiktok.apk

      - name: Verify package, version and TikTok signing certificate
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          echo "aapt=$AAPT"
          echo "apksigner=$APKSIGNER"
          "$AAPT" dump badging tiktok.apk | head -n 5 | tee badging.txt
          grep -F "package: name='com.zhiliaoapp.musically'" badging.txt
          grep -F "versionCode='2024700030'" badging.txt
          grep -F "versionName='47.0.3'" badging.txt
          "$APKSIGNER" verify --print-certs tiktok.apk | tee certs.txt
          grep -Fi "9041803e91bcb814b4b4399fb5c85a91640b755e5e8ba76813814bf4cf2ab5ba" certs.txt

      - name: Download current apktool
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          api = requests.get("https://api.github.com/repos/iBotPeaches/Apktool/releases/latest", timeout=30)
          api.raise_for_status()
          rel = api.json()
          assets = [a for a in rel["assets"] if a["name"].startswith("apktool_") and a["name"].endswith(".jar")]
          if not assets:
              raise SystemExit("No apktool jar in latest release")
          a = assets[0]
          print("apktool:", rel["tag_name"], a["name"])
          data = requests.get(a["browser_download_url"], timeout=120)
          data.raise_for_status()
          open("apktool.jar", "wb").write(data.content)
          PY
          ls -lh apktool.jar

      - name: Decode resources
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx4g -jar apktool.jar d -f -s tiktok.apk -o decoded
          echo "Chinese resource directories:"
          find decoded/res -maxdepth 1 -type d \( -name 'values-zh*' -o -name 'values-b+zh*' \) -print | sort

      - name: Print official Chinese UI wording
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/terms.py <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path("decoded/res")
          zhdirs = sorted([p for p in root.iterdir() if p.is_dir() and (p.name.startswith("values-zh") or p.name.startswith("values-b+zh"))])
          print("ZH_DIRS:", ", ".join(p.name for p in zhdirs) or "(none)")

          def strings(directory):
              out = {}
              for f in sorted(directory.glob("*.xml")):
                  try:
                      tree = ET.parse(f)
                  except Exception:
                      continue
                  for node in tree.getroot():
                      if node.tag == "string":
                          name = node.attrib.get("name")
                      elif node.tag == "item" and node.attrib.get("type") == "string":
                          name = node.attrib.get("name")
                      else:
                          continue
                      if not name:
                          continue
                      text = "".join(node.itertext()).strip()
                      if text:
                          out[name] = text
              return out

          default = strings(root / "values")
          zh = {d.name: strings(d) for d in zhdirs}
          targets = [
              "For You","Following","Friends","Nearby","Story","Stories","Duet","Stitch",
              "Inbox","Profile","Repost","Favorites","Activity","Shop","Series","LIVE",
              "Search","Comments","Not interested","Playlist","Auto scroll","Full screen",
              "Save","Share","Download","Block","Unblock","Creator","Sound","New followers",
              "Message requests","Watch history","Settings and privacy","Privacy","Language",
              "App language"
          ]

          print("\n=== ENGLISH-KEYED TERM PAIRS ===")
          for target in targets:
              hits = []
              rx = re.compile(r"(?i)(^|\\b)" + re.escape(target) + r"($|\\b)")
              for key, en in default.items():
                  if rx.search(en):
                      vals = [(loc, table.get(key, "")) for loc, table in zh.items()]
                      if any(v for _, v in vals):
                          hits.append((key, en, vals))
              if not hits:
                  continue
              print("\n###", target)
              for key, en, vals in sorted(hits, key=lambda x:(len(x[1]),x[1],x[0]))[:40]:
                  print("KEY:", key)
                  print("EN :", en.replace("\n","\\n"))
                  for loc, val in vals:
                      if val:
                          print(loc + ":", val.replace("\n","\\n"))

          print("\n=== DIRECT SIMPLIFIED-CHINESE HITS ===")
          cn = ["为你","推荐","关注","好友","附近","限时动态","故事","合拍","拼接","画面拼贴",
                "收件箱","个人资料","转发","收藏","活动","商店","商城","系列","直播","不感兴趣",
                "播放列表","自动滚动","全屏","新关注者","消息请求","观看历史"]
          for loc, table in zh.items():
              if "CN" not in loc and "Hans" not in loc and loc not in {"values-zh"}:
                  continue
              print("\n--", loc, "--")
              count = 0
              for key, val in sorted(table.items()):
                  if any(x in val for x in cn):
                      print(key + "\t" + default.get(key,"").replace("\n","\\n") + "\t" + val.replace("\n","\\n"))
                      count += 1
                      if count >= 350:
                          print("... truncated after 350 hits")
                          break
          PY
          python /tmp/terms.py
