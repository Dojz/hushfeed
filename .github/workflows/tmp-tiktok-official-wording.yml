name: Temporary TikTok 47.0.3 official wording audit

on:
  push:
    branches:
      - zh-cn-l10n

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download official-signed TikTok 47.0.3 package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          urls = [
              "https://d.apkpure.com/b/XAPK/com.zhiliaoapp.musically?versionCode=2024700030",
              "https://d.apkpure.net/b/XAPK/com.zhiliaoapp.musically?versionCode=2024700030",
              "https://d.apkpure.com/b/APK/com.zhiliaoapp.musically?versionCode=2024700030",
              "https://d.apkpure.net/b/APK/com.zhiliaoapp.musically?versionCode=2024700030",
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/141.0 Mobile Safari/537.36",
              "Referer": "https://apkpure.net/tiktok-app/com.zhiliaoapp.musically/download/47.0.3",
          }
          for url in urls:
              try:
                  print("trying", url)
                  with requests.get(url, headers=headers, stream=True, timeout=180, allow_redirects=True) as r:
                      print(" ->", r.status_code, r.url[:220], r.headers.get("content-type"), r.headers.get("content-length"))
                      if r.status_code != 200:
                          continue
                      with open("package.bin", "wb") as out:
                          total = 0
                          for chunk in r.iter_content(1024 * 1024):
                              if chunk:
                                  out.write(chunk)
                                  total += len(chunk)
                      print("downloaded", total)
                      if total > 50_000_000:
                          break
              except Exception as e:
                  print("error:", e)
          else:
              raise SystemExit("No APKPure 47.0.3 artifact could be downloaded")
          if total <= 50_000_000:
              raise SystemExit("Downloaded artifact is unexpectedly small")
          PY
          file package.bin
          sha256sum package.bin
          if unzip -t package.bin >/dev/null 2>&1; then
            mkdir -p xapk
            unzip -q package.bin -d xapk
            echo "XAPK members:"
            find xapk -maxdepth 2 -type f -name '*.apk' -printf '%p %s bytes\n' | sort -k2nr
            BASE="$(find xapk -maxdepth 2 -type f -name '*.apk' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            # Prefer manifest-declared base names if present; otherwise the largest APK is normally base.
            for candidate in xapk/base.apk xapk/com.zhiliaoapp.musically.apk; do
              if [ -f "$candidate" ]; then BASE="$candidate"; break; fi
            done
            cp "$BASE" tiktok.apk
            echo "Selected base: $BASE"
          else
            cp package.bin tiktok.apk
          fi
          ls -lh tiktok.apk

      - name: Verify package, version and TikTok signing certificate
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          echo "aapt=$AAPT"
          echo "apksigner=$APKSIGNER"
          "$AAPT" dump badging tiktok.apk | head -n 5 | tee badging.txt
          grep -F "package: name='com.zhiliaoapp.musically'" badging.txt
          grep -F "versionCode='2024700030'" badging.txt
          grep -F "versionName='47.0.3'" badging.txt
          "$APKSIGNER" verify --print-certs tiktok.apk | tee certs.txt
          grep -Fi "9041803e91bcb814b4b4399fb5c85a91640b755e5e8ba76813814bf4cf2ab5ba" certs.txt

      - name: Download current apktool
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          api = requests.get("https://api.github.com/repos/iBotPeaches/Apktool/releases/latest", timeout=30)
          api.raise_for_status()
          rel = api.json()
          assets = [a for a in rel["assets"] if a["name"].startswith("apktool_") and a["name"].endswith(".jar")]
          if not assets:
              raise SystemExit("No apktool jar in latest release")
          a = assets[0]
          print("apktool:", rel["tag_name"], a["name"])
          data = requests.get(a["browser_download_url"], timeout=120)
          data.raise_for_status()
          open("apktool.jar", "wb").write(data.content)
          PY
          ls -lh apktool.jar

      - name: Decode English and Chinese language splits
        shell: bash
        run: |
          set -euo pipefail
          test -f xapk/config.en.apk
          test -f xapk/config.zh.apk
          java -Xmx2g -jar apktool.jar d -f -s xapk/config.en.apk -o decoded-en
          java -Xmx2g -jar apktool.jar d -f -s xapk/config.zh.apk -o decoded-zh
          echo "English split value directories:"
          find decoded-en/res -maxdepth 1 -type d -name 'values*' -print | sort
          echo "Chinese split value directories:"
          find decoded-zh/res -maxdepth 1 -type d -name 'values*' -print | sort

      - name: Print official Chinese UI wording
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/terms.py <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          def strings(root):
              out = {}
              for directory in sorted(root.glob("values*")):
                  for f in sorted(directory.glob("*.xml")):
                      try:
                          tree = ET.parse(f)
                      except Exception:
                          continue
                      for node in tree.getroot():
                          if node.tag == "string":
                              name = node.attrib.get("name")
                          elif node.tag == "item" and node.attrib.get("type") == "string":
                              name = node.attrib.get("name")
                          else:
                              continue
                          if not name:
                              continue
                          text = "".join(node.itertext()).strip()
                          if text:
                              out[name] = text
              return out

          en = strings(Path("decoded-en/res"))
          zh = strings(Path("decoded-zh/res"))
          print("EN_STRINGS:", len(en))
          print("ZH_STRINGS:", len(zh))
          print("PAIRED_KEYS:", len(set(en) & set(zh)))

          targets = [
              "For You","Following","Friends","Nearby","Story","Stories","Duet","Stitch",
              "Inbox","Profile","Repost","Favorites","Activity","Shop","Series","LIVE",
              "Search","Comments","Not interested","Playlist","Auto scroll","Full screen",
              "Save","Share","Download","Block","Unblock","Creator","Sound","New followers",
              "Message requests","Watch history","Settings and privacy","Privacy","Language",
              "App language","Report","Follow","Like","Photo","Video"
          ]

          print("\n=== OFFICIAL 47.0.3 EN -> ZH PAIRS ===")
          for target in targets:
              rx = re.compile(r"(?i)(^|\\b)" + re.escape(target) + r"($|\\b)")
              hits=[]
              for key, english in en.items():
                  chinese=zh.get(key)
                  if chinese and rx.search(english):
                      hits.append((english,key,chinese))
              if not hits:
                  continue
              print("\n###", target)
              for english,key,chinese in sorted(hits,key=lambda x:(len(x[0]),x[0],x[1]))[:60]:
                  print(key+"\t"+english.replace("\n","\\n")+"\t"+chinese.replace("\n","\\n"))

          print("\n=== DIRECT CHINESE TERM HITS ===")
          terms = ["为你","推荐","关注","好友","附近","限时动态","故事","合拍","拼接","画面拼贴",
                   "收件箱","个人资料","转发","收藏","活动","商店","商城","系列","直播","不感兴趣",
                   "播放列表","自动滚动","全屏","新关注者","消息请求","观看历史","保存","分享","下载"]
          count=0
          for key,chinese in sorted(zh.items()):
              if any(t in chinese for t in terms):
                  print(key+"\t"+en.get(key,"").replace("\n","\\n")+"\t"+chinese.replace("\n","\\n"))
                  count += 1
                  if count >= 500:
                      print("... truncated after 500 direct hits")
                      break
          PY
          python /tmp/terms.py
