name: Temporary fetch Morphe desktop

on:
  push:
    branches:
      - zh-cn-l10n
    paths:
      - .github/workflows/tmp-fetch-morphe-desktop.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verified Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/MorpheApp/morphe-desktop/releases/download/v1.17.0/morphe-desktop-1.17.0-all.jar'
          curl --fail --location --retry 3 --output morphe-desktop-1.17.0-all.jar "$url"
          echo '8cf6a9eab4ee9dab146bddc24681897851564f53116baec11f36ba2fa2f589be  morphe-desktop-1.17.0-all.jar' | sha256sum -c -

      - name: Upload Morphe Desktop
        uses: actions/upload-artifact@v4
        with:
          name: morphe-desktop-1.17.0
          path: morphe-desktop-1.17.0-all.jar
          if-no-files-found: error
          retention-days: 1
